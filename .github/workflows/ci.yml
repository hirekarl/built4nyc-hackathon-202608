name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm install -g npm@latest
      - run: npm ci

      - name: Lint
        run: |
          npm run lint
          npm run lint:md

      - name: Format check
        run: |
          npm run format:check
          npm run format:md:check

      # vitest does not type-check and eslint does not either, so type errors
      # in test files reach the build stage otherwise. The script runs
      # `next typegen` first because tsconfig includes `.next/types`, where
      # Next generates globals like LayoutProps — without it `tsc` fails on a
      # clean checkout that has never been built.
      - name: Typecheck
        run: npm run typecheck

      - name: Test with coverage
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm install -g npm@latest
      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # test:e2e:ci excludes the two @live-data tests in report-flow.spec.ts:
      # they assert exact PRD §12 crash counts against live, continuously
      # backfilled NYC Open Data with no SOCRATA_APP_TOKEN provisioned, so an
      # upstream data edit (not a code change) can red this required job.
      # Run `npm run test:e2e:live` on demand for that proof instead.
      - name: Run E2E tests
        run: npm run test:e2e:ci
